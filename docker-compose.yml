services:
  website:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "${WEBSITE_PORT:-8080}:80"

    networks:
      - company_network

  interfaces:
    build:
      context: ./uis
      dockerfile: Dockerfile
      args:
        INTERNAL_BACKEND_URL: http://backend:8000

    ports:
      - "${TRACKER_PORT:-3002}:3000"
      - "${BACKOFFICE_PORT:-3003}:3001"

    environment:
      INTERNAL_BACKEND_URL: http://backend:8000

    command: [ "sh", "/app/start.sh" ]

    depends_on:
      - backend

    networks:
      - company_network

  backend:
    build:
      context: .
      dockerfile: services/api/Dockerfile

    env_file:
      - ./services/api/.env

    environment:
      DATABASE_URL: sqlite:////workspace/services/api/inventory.db
      PYTHONPATH: /workspace

    volumes:
      - ./services/api/inventory.db:/workspace/services/api/inventory.db

    command: [ "uvicorn", "services.api.main:app", "--host", "0.0.0.0", "--port", "8000" ]

    networks:
      - company_network

networks:
  company_network:
    name: company_network
    driver: bridge
